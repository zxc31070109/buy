<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🇭🇰 香港陀螺連線代購 | iPhone 錄單助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;

<body class="bg-slate-900 antialiased text-slate-100 selection:bg-rose-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Lucide Icon Wrapper (Isolated SVG Rendering)
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          const camelName = name.replace(/-([a-z0-9])/g, (m, g) => g.toUpperCase());
          const pascalName = camelName.charAt(0).toUpperCase() + camelName.slice(1);
          
          const iconDef = window.lucide.icons && (window.lucide.icons[pascalName] || window.lucide.icons[camelName] || window.lucide.icons[name]);

          ref.current.innerHTML = '';
          if (iconDef && typeof window.lucide.createElement === 'function') {
            const svg = window.lucide.createElement(iconDef);
            svg.setAttribute('class', className);
            ref.current.appendChild(svg);
          } else {
            const iconElem = document.createElement('i');
            iconElem.setAttribute('data-lucide', name);
            iconElem.setAttribute('class', className);
            ref.current.appendChild(iconElem);
            if (typeof window.lucide.createIcons === 'function') {
              window.lucide.createIcons({ element: ref.current });
            }
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0 align-middle leading-none" />;
    };

    const ShoppingBag = (props) => <Icon name="shopping-bag" {...props} />;
    const Plus = (props) => <Icon name="plus" {...props} />;
    const Minus = (props) => <Icon name="minus" {...props} />;
    const Trash2 = (props) => <Icon name="trash-2" {...props} />;
    const Edit3 = (props) => <Icon name="edit-3" {...props} />;
    const CheckCircle2 = (props) => <Icon name="check-circle-2" {...props} />;
    const AlertCircle = (props) => <Icon name="alert-circle" {...props} />;
    const Clock = (props) => <Icon name="clock" {...props} />;
    const Copy = (props) => <Icon name="copy" {...props} />;
    const Check = (props) => <Icon name="check" {...props} />;
    const Search = (props) => <Icon name="search" {...props} />;
    const Filter = (props) => <Icon name="filter" {...props} />;
    const RefreshCw = (props) => <Icon name="refresh-cw" {...props} />;
    const Table = (props) => <Icon name="table" {...props} />;
    const FileSpreadsheet = (props) => <Icon name="file-spreadsheet" {...props} />;
    const Layers = (props) => <Icon name="layers" {...props} />;
    const Settings = (props) => <Icon name="settings" {...props} />;
    const ArrowRight = (props) => <Icon name="arrow-right" {...props} />;
    const ExternalLink = (props) => <Icon name="external-link" {...props} />;
    const DollarSign = (props) => <Icon name="dollar-sign" {...props} />;
    const Package = (props) => <Icon name="package" {...props} />;
    const Send = (props) => <Icon name="send" {...props} />;
    const Sparkles = (props) => <Icon name="sparkles" {...props} />;
    const ChevronDown = (props) => <Icon name="chevron-down" {...props} />;
    const X = (props) => <Icon name="x" {...props} />;
    const Zap = (props) => <Icon name="zap" {...props} />;
    const Lock = (props) => <Icon name="lock" {...props} />;
    const Unlock = (props) => <Icon name="unlock" {...props} />;

    // 加密存放的敏感網址 (金鑰為密碼 0429)
    // 原始碼中不會出現明文 Google Sheet 或 Webhook 網址，推至 GitHub 也無法從源碼看出！
    const ENCRYPTED_SHEET_URL = 'WEBGSUMOHRZUW1FKHlNdVldYVxdTW18WQ0RAXFFQQVFVUUZKH1AdCFREBGZJTh94Zw15TXxsbVRUBnFKXWAGXAlQdwFpBUhgZmsBWEdBSnQIR0EWVVBbTQ9BQUkNR1pYQl1cXg==';
    const ENCRYPTED_WEBHOOK_URL = 'WEBGSUMOHRZDV0BQQEAcXl9bVVVVGlFWXRtfWFNGXUofRx14e1JLWlJDXkxKA1NtRHxgC2hAeHNgZlBUQExqSmJEX3p6YXxPYHZIfnhkcXoIZ2ZjdwMGCH1wdVZ6c0JBXXpVSVtiRHxqZXVOVxtXQVVX';

    const decryptSecret = (base64Str, key) => {
      try {
        const raw = atob(base64Str);
        let result = '';
        for (let i = 0; i < raw.length; i++) {
          result += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return result;
      } catch (e) {
        return '';
      }
    };

    const INITIAL_PRICE_TABLE = [
      { id: '1', code: 'CX14', name: 'CX-14 鋼鐵戰龍 (烈火版)', priceTWD: 750, category: 'CX系列', note: '熱門限定款' },
      { id: '2', code: 'BX40', name: 'BX-40 暴風天馬 X', priceTWD: 680, category: 'BX系列', note: '主打款' },
      { id: '3', code: 'UX20', name: 'UX-20 終極武神 進化型', priceTWD: 720, category: 'UX系列', note: '附特殊軸心' },
      { id: '4', code: 'BX35', name: 'BX-35 隨機強化包 (抽包)', priceTWD: 320, category: 'BX系列', note: '隨機1入' },
      { id: '5', code: 'BX36', name: 'BX-36 抽包全套 (6入)', priceTWD: 1900, category: 'BX系列', note: '整盒預訂' },
      { id: '6', code: 'UX01', name: 'UX-01 蒼穹獵鷹 啟動組', priceTWD: 850, category: 'UX系列', note: '含發射器' },
      { id: '7', code: 'ACC01', name: '拉線式加重發射器 (黑金)', priceTWD: 450, category: '配件', note: '通用握把' }
    ];

    const INITIAL_ORDERS = [
      {
        id: 'HK-001',
        lineName: '小明 (台北戰友)',
        items: [
          { code: 'BX40', qty: 2, price: 680 },
          { code: 'UX20', qty: 1, price: 720 }
        ],
        totalCount: 3,
        boxOption: '可拆盒',
        purchaseStatus: '已採買',
        depositPerUnit: 300,
        depositPaid: 900,
        depositStatus: '已入帳',
        bankLast5: '12345',
        totalAmount: 2080,
        remainingCod: 1180,
        myshipStatus: '待開賣場',
        myshipCode: '',
        shippingStatus: '待出貨',
        refundAccount: '',
        note: '可拆盒省空間，優先挑八角完整',
        createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      },
      {
        id: 'HK-002',
        lineName: '阿華 (陀螺隊長)',
        items: [
          { code: 'CX14', qty: 1, price: 750 }
        ],
        totalCount: 1,
        boxOption: '保留外盒',
        purchaseStatus: '缺貨待退',
        depositPerUnit: 300,
        depositPaid: 300,
        depositStatus: '已入帳',
        bankLast5: '67890',
        totalAmount: 750,
        remainingCod: 0,
        myshipStatus: '免開賣場',
        myshipCode: '',
        shippingStatus: '已退款',
        refundAccount: '822 中信 123456789012',
        note: '現場逛兩家均缺貨，已退回訂金',
        createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('form');

      const [priceTable, setPriceTable] = useState(() => {
        const saved = localStorage.getItem('hk_beyblade_price_table');
        return saved ? JSON.parse(saved) : INITIAL_PRICE_TABLE;
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('hk_beyblade_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      });

      // 密碼解鎖與加密網址管理 (預設密碼: 0429)
      const [inputPassword, setInputPassword] = useState('');
      const [unlockedSheetUrl, setUnlockedSheetUrl] = useState(() => {
        const savedKey = localStorage.getItem('hk_secret_pass');
        if (savedKey) {
          const dec = decryptSecret(ENCRYPTED_SHEET_URL, savedKey);
          if (dec.startsWith('https://')) return dec;
        }
        return '';
      });

      const [unlockedWebhookUrl, setUnlockedWebhookUrl] = useState(() => {
        const savedKey = localStorage.getItem('hk_secret_pass');
        if (savedKey) {
          const dec = decryptSecret(ENCRYPTED_WEBHOOK_URL, savedKey);
          if (dec.startsWith('https://')) return dec;
        }
        return '';
      });

      const [isUnlocked, setIsUnlocked] = useState(() => {
        const savedKey = localStorage.getItem('hk_secret_pass');
        if (savedKey) {
          const dec = decryptSecret(ENCRYPTED_SHEET_URL, savedKey);
          return dec.startsWith('https://');
        }
        return false;
      });

      // Google Apps Script Webhook 網址設定
      const [webhookUrl, setWebhookUrl] = useState(() => {
        const saved = localStorage.getItem('hk_beyblade_webhook_url');
        if (!saved || saved.includes('AKfycbyw')) {
          const savedKey = localStorage.getItem('hk_secret_pass');
          if (savedKey) {
            const dec = decryptSecret(ENCRYPTED_WEBHOOK_URL, savedKey);
            if (dec.startsWith('https://')) return dec;
          }
          return '';
        }
        return saved;
      });

      const handleUnlockSecret = (passwordToTry) => {
        const pwd = (passwordToTry !== undefined ? passwordToTry : inputPassword).trim();
        if (!pwd) {
          showToast('⚠️ 請輸入解鎖密碼');
          return false;
        }

        const decSheet = decryptSecret(ENCRYPTED_SHEET_URL, pwd);
        const decWebhook = decryptSecret(ENCRYPTED_WEBHOOK_URL, pwd);

        if (decSheet.startsWith('https://docs.google.com') && decWebhook.startsWith('https://script.google.com')) {
          localStorage.setItem('hk_secret_pass', pwd);
          setUnlockedSheetUrl(decSheet);
          setUnlockedWebhookUrl(decWebhook);
          setIsUnlocked(true);
          setInputPassword('');
          if (!webhookUrl || webhookUrl.includes('AKfycbyw')) {
            setWebhookUrl(decWebhook);
          }
          showToast('🎉 解鎖成功！已顯示線上 Google 試算表與 Webhook 網址');
          return true;
        } else {
          showToast('❌ 密碼錯誤！請再試一次');
          return false;
        }
      };

      const handleLockSecret = () => {
        localStorage.removeItem('hk_secret_pass');
        setUnlockedSheetUrl('');
        setUnlockedWebhookUrl('');
        setIsUnlocked(false);
        showToast('🔒 已重新鎖定網址');
      };

      const [isTestingWebhook, setIsTestingWebhook] = useState(false);
      const [isLoadingOrders, setIsLoadingOrders] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);

      const [autoSync, setAutoSync] = useState(() => {
        return localStorage.getItem('hk_beyblade_auto_sync') !== 'false';
      });

      const [showGasTutorial, setShowGasTutorial] = useState(false);

      useEffect(() => {
        localStorage.setItem('hk_beyblade_price_table', JSON.stringify(priceTable));
      }, [priceTable]);

      useEffect(() => {
        localStorage.setItem('hk_beyblade_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        localStorage.setItem('hk_beyblade_webhook_url', webhookUrl);
      }, [webhookUrl]);

      useEffect(() => {
        localStorage.setItem('hk_beyblade_auto_sync', String(autoSync));
      }, [autoSync]);

      // 提示訊息 Notification
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 2500);
      };

      // 從 Google Apps Script Webhook 即時讀取線上 Google 試算表訂單
      const fetchOrdersFromGoogleSheet = async (showToastNotice = true) => {
        if (!webhookUrl.trim()) {
          if (showToastNotice) showToast('⚠️ 請先設定 Webhook 網址！');
          return false;
        }

        setIsLoadingOrders(true);
        try {
          const response = await fetch(webhookUrl.trim());
          const text = await response.text();
          let data = null;
          try {
            data = JSON.parse(text);
          } catch (e) {
            // GAS 返回非 JSON 格式
          }

          if (data && data.status === 'success' && Array.isArray(data.orders)) {
            if (data.orders.length > 0) {
              setOrders(data.orders);
              setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
              if (showToastNotice) {
                showToast(`✅ 已成功從 Google 試算表載入 ${data.orders.length} 筆最新訂單！`);
              }
            } else {
              if (showToastNotice) showToast('ℹ️ Google 試算表目前尚無訂單紀錄');
            }
            setIsLoadingOrders(false);
            return true;
          } else {
            if (showToastNotice) {
              showToast('⚠️ 試算表未回傳訂單資料，請確認 GAS 是否已部署最新腳本');
            }
          }
        } catch (err) {
          console.error('Failed to fetch orders from Google Sheet:', err);
          if (showToastNotice) showToast('❌ 連線試算表失敗，顯示本地緩存資料');
        }
        setIsLoadingOrders(false);
        return false;
      };

      const [hasInitialFetched, setHasInitialFetched] = useState(false);

      // 切換到「訂單清單」頁面時，初次自動同步一次，後續由使用者手動點擊「重新刷新」
      useEffect(() => {
        if (currentTab === 'orders' && webhookUrl.trim() && !hasInitialFetched) {
          fetchOrdersFromGoogleSheet(false);
          setHasInitialFetched(true);
        }
      }, [currentTab, webhookUrl, hasInitialFetched]);

      const sendOrderToWebhook = async (order) => {
        if (!webhookUrl.trim()) return false;
        try {
          await fetch(webhookUrl.trim(), {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(order)
          });
          return true;
        } catch (err) {
          console.error('Webhook sync failed:', err);
          return false;
        }
      };

      const handleTestWebhook = async () => {
        if (!webhookUrl.trim()) {
          showToast('⚠️ 請先輸入 Webhook 網址！');
          return;
        }
        setIsTestingWebhook(true);
        const testOrder = {
          id: 'HK-TEST-' + Math.floor(100 + Math.random() * 900),
          lineName: '系統測試員',
          items: [{ code: 'BX-00', qty: 1 }],
          totalCount: 1,
          boxOption: '外盒完整',
          purchaseStatus: '未採買',
          depositPaid: 0,
          bankLast5: '88888',
          depositStatus: '已入帳',
          totalAmount: 100,
          remainingCod: 100,
          myshipCode: 'TEST',
          myshipStatus: '未下單',
          shippingStatus: '未出貨',
          refundAccount: '',
          note: '連線測試筆記',
          createdAt: new Date().toLocaleString('zh-TW', { hour12: false })
        };

        const success = await sendOrderToWebhook(testOrder);
        setIsTestingWebhook(false);
        if (success) {
          showToast('✅ 測試請求已發送！請至 Google 試算表確認是否有新增測試資料。');
        } else {
          showToast('❌ 發送失敗，請確認 Webhook 網址是否正確。');
        }
      };

      const nextOrderNumber = useMemo(() => {
        const maxNum = orders.reduce((max, order) => {
          const match = order.id.match(/HK-(\d+)/);
          if (match) {
            const num = parseInt(match[1], 10);
            return num > max ? num : max;
          }
          return max;
        }, 0);
        return `HK-${String(maxNum + 1).padStart(3, '0')}`;
      }, [orders]);

      const [formOrderId, setFormOrderId] = useState(nextOrderNumber);
      const [lineName, setLineName] = useState('');
      const [selectedItems, setSelectedItems] = useState([]);
      const [customCodeInput, setCustomCodeInput] = useState('');
      const [customPriceInput, setCustomPriceInput] = useState('');
      const [boxOption, setBoxOption] = useState('可拆盒');
      const [purchaseStatus, setPurchaseStatus] = useState('已採買');
      const [depositPerUnit, setDepositPerUnit] = useState(300);
      const [depositStatus, setDepositStatus] = useState('已入帳');
      const [bankLast5, setBankLast5] = useState('');
      const [refundAccount, setRefundAccount] = useState('');
      const [note, setNote] = useState('');
      const [editingOrderId, setEditingOrderId] = useState(null);

      useEffect(() => {
        if (!editingOrderId) {
          setFormOrderId(nextOrderNumber);
        }
      }, [nextOrderNumber, editingOrderId]);

      const totalCount = useMemo(() => {
        return selectedItems.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
      }, [selectedItems]);

      const totalAmount = useMemo(() => {
        return selectedItems.reduce((sum, item) => sum + ((Number(item.qty) || 0) * (Number(item.price) || 0)), 0);
      }, [selectedItems]);

      const depositExpected = totalCount * depositPerUnit;
      const remainingCod = Math.max(0, totalAmount - depositExpected);

      const handleAddItemFromPriceTable = (item) => {
        setSelectedItems(prev => {
          const existing = prev.find(i => i.code === item.code);
          if (existing) {
            return prev.map(i => i.code === item.code ? { ...i, qty: i.qty + 1 } : i);
          } else {
            return [...prev, { code: item.code, qty: 1, price: item.priceTWD, name: item.name }];
          }
        });
      };

      const handleUpdateQty = (code, delta) => {
        setSelectedItems(prev => {
          return prev
            .map(i => {
              if (i.code === code) {
                const newQty = i.qty + delta;
                return newQty > 0 ? { ...i, qty: newQty } : null;
              }
              return i;
            })
            .filter(Boolean);
        });
      };

      const handleAddCustomItem = () => {
        if (!customCodeInput.trim()) return;
        const price = Number(customPriceInput) || 650;
        const upperCode = customCodeInput.trim().toUpperCase();

        setSelectedItems(prev => {
          const existing = prev.find(i => i.code === upperCode);
          if (existing) {
            return prev.map(i => i.code === upperCode ? { ...i, qty: i.qty + 1 } : i);
          } else {
            return [...prev, { code: upperCode, qty: 1, price: price, name: upperCode }];
          }
        });

        setCustomCodeInput('');
        setCustomPriceInput('');
      };

      const handleResetForm = () => {
        setEditingOrderId(null);
        setFormOrderId(nextOrderNumber);
        setLineName('');
        setSelectedItems([]);
        setBoxOption('可拆盒');
        setPurchaseStatus('已採買');
        setDepositStatus('已入帳');
        setBankLast5('');
        setRefundAccount('');
        setNote('');
      };

      const handleSaveOrder = async () => {
        if (!lineName.trim()) {
          showToast('⚠️ 請輸入 LINE 名稱/暱稱');
          return;
        }
        if (selectedItems.length === 0) {
          showToast('⚠️ 請至少選擇或輸入 1 款陀螺型號');
          return;
        }

        const newOrder = {
          id: editingOrderId || formOrderId,
          lineName: lineName.trim(),
          items: selectedItems,
          totalCount,
          boxOption,
          purchaseStatus,
          depositPerUnit,
          depositPaid: depositExpected,
          depositStatus,
          bankLast5: bankLast5.trim(),
          totalAmount,
          remainingCod,
          myshipStatus: purchaseStatus === '缺貨待退' ? '免開賣場' : '待開賣場',
          myshipCode: '',
          shippingStatus: purchaseStatus === '缺貨待退' ? '已退款' : '待出貨',
          refundAccount: refundAccount.trim(),
          note: note.trim(),
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        if (editingOrderId) {
          setOrders(prev => prev.map(o => o.id === editingOrderId ? newOrder : o));
          showToast(`✅ 訂單 ${editingOrderId} 更新成功！`);
        } else {
          setOrders(prev => [newOrder, ...prev]);

          if (webhookUrl.trim() && autoSync) {
            sendOrderToWebhook(newOrder);
            showToast(`🎉 訂單 ${newOrder.id} 新增成功，已即時寫入 Google Sheet！`);
          } else {
            showToast(`🎉 訂單 ${newOrder.id} 新增成功！`);
          }
        }

        handleResetForm();
        setCurrentTab('orders');
      };

      const handleStartEditOrder = (order) => {
        setEditingOrderId(order.id);
        setFormOrderId(order.id);
        setLineName(order.lineName);
        setSelectedItems(order.items || []);
        setBoxOption(order.boxOption || '可拆盒');
        setPurchaseStatus(order.purchaseStatus || '已採買');
        setDepositPerUnit(order.depositPerUnit || 300);
        setDepositStatus(order.depositStatus || '已入帳');
        setBankLast5(order.bankLast5 || '');
        setRefundAccount(order.refundAccount || '');
        setNote(order.note || '');
        setCurrentTab('form');
      };

      const handleDeleteOrder = (id) => {
        if (confirm(`確定要刪除訂單 ${id} 嗎？`)) {
          setOrders(prev => prev.filter(o => o.id !== id));
          showToast(`🗑️ 訂單 ${id} 已刪除`);
        }
      };

      const handleSingleOrderSync = (order) => {
        if (!webhookUrl.trim()) {
          showToast('⚠️ 請先在「匯出同步」頁面設定 Google Webhook 網址！');
          setCurrentTab('sync');
          return;
        }
        sendOrderToWebhook(order);
        showToast(`⚡ 訂單 ${order.id} 已發送新增至 Google 試算表！`);
      };

      const gasScriptCode = `function doGet(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var rows = sheet.getDataRange().getValues();
    var orders = [];
    
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row[1] || String(row[1]).trim() === '' || String(row[1]).indexOf('訂單編號') !== -1) continue;

      var itemsStr = String(row[3] || '');
      var items = [];
      if (itemsStr) {
        var parts = itemsStr.split(',');
        for (var j = 0; j < parts.length; j++) {
          var p = parts[j].trim();
          var match = p.match(/^(.+)\*(\d+)$/);
          if (match) {
            items.push({ code: match[1].trim(), qty: parseInt(match[2], 10), price: 0 });
          } else if (p) {
            items.push({ code: p, qty: 1, price: 0 });
          }
        }
      }

      var bankLast5 = String(row[8] || '').replace(/^'/, '');

      orders.push({
        id: String(row[1] || ''),
        lineName: String(row[2] || ''),
        items: items,
        totalCount: Number(row[4]) || 0,
        boxOption: String(row[5] || '可拆盒'),
        purchaseStatus: String(row[6] || '已採買'),
        depositPaid: Number(row[7]) || 0,
        bankLast5: bankLast5,
        depositStatus: String(row[9] || '已入帳'),
        totalAmount: Number(row[10]) || 0,
        remainingCod: Number(row[11]) || 0,
        myshipCode: String(row[12] || ''),
        myshipStatus: String(row[13] || ''),
        shippingStatus: String(row[14] || ''),
        refundAccount: String(row[15] || ''),
        note: String(row[16] || ''),
        createdAt: String(row[17] || '')
      });
    }

    return ContentService.createTextOutput(JSON.stringify({ status: "success", orders: orders }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    var itemsStr = (data.items || []).map(function(i) {
      return i.code + '*' + i.qty;
    }).join(', ');

    var nextSeq = Math.max(1, sheet.getLastRow());

    var newRow = [
      nextSeq,                            // 1. 序號
      data.id || '',                      // 2. 訂單編號
      data.lineName || '',               // 3. LINE 名稱
      itemsStr,                           // 4. 訂購品項與數量
      data.totalCount || 0,               // 5. 總顆數
      data.boxOption || '',               // 6. 盒況需求
      data.purchaseStatus || '',          // 7. 現場採買狀況
      data.depositPaid || 0,              // 8. 應收訂金
      "'" + (data.bankLast5 || ''),      // 9. 匯款末五碼
      data.depositStatus || '',           // 10. 訂金核對
      data.totalAmount || 0,              // 11. 代購總金額
      data.remainingCod || 0,             // 12. 賣貨便尾款
      data.myshipCode || '',              // 13. 賣場代碼
      data.myshipStatus || '',            // 14. 下單狀態
      data.shippingStatus || '',          // 15. 出貨狀態
      data.refundAccount || '',           // 16. 退款帳號
      data.note || '',                    // 17. 備註
      data.createdAt || ''               // 18. 時間
    ];

    sheet.appendRow(newRow);

    return ContentService.createTextOutput(JSON.stringify({ status: "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

                </div>

                <div className="bg-slate-800/90 rounded-2xl p-4 border border-slate-700 shadow-lg space-y-3">
                  <div className="flex items-center gap-2 text-white font-bold text-sm">
                    <FileSpreadsheet className="w-5 h-5 text-emerald-400" />
                    <span>全表整批備份匯出</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    若需一次複製全部歷史訂單全表內容，可點擊下方一鍵複製手動貼入 Google Sheet：
                  </p>

                  <button
                    type="button"
                    onClick={handleCopyForGoogleSheet}
                    className="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 active:scale-95 cursor-pointer"
                  >
                    <Copy className="w-4 h-4" />
                    <span>一鍵複製全表 (直接貼入 Google Sheet)</span>
                  </button>
                </div>

                <div className="bg-slate-800/80 rounded-2xl p-3.5 border border-slate-700 space-y-2">
                  <span className="text-xs font-bold text-slate-300">📊 當前代購行李與金流統計</span>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">總訂單筆數</div>
                      <div className="text-sm font-bold font-mono text-white">{orders.length} 筆</div>
                    </div>
                    <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">陀螺總顆數 (行李體積)</div>
                      <div className="text-sm font-bold font-mono text-indigo-400">
                        {orders.reduce((s, o) => s + o.totalCount, 0)} 顆
                      </div>
                    </div>
                    <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">已收取訂金總額</div>
                      <div className="text-sm font-bold font-mono text-amber-400">
                        NT$ {orders.reduce((s, o) => s + o.depositPaid, 0).toLocaleString()}
                      </div>
                    </div>
                    <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
                      <div className="text-[10px] text-slate-400">預計賣貨便尾款總額</div>
                      <div className="text-sm font-bold font-mono text-rose-400">
                        NT$ {orders.reduce((s, o) => s + o.remainingCod, 0).toLocaleString()}
                      </div>
                    </div>
                  </div>
                </div>

                {/* 📊 線上 Google 試算表 (Excel) 網址卡片 (分頁最下方，含密碼解鎖保護) */}
                <div className="bg-gradient-to-br from-emerald-900/40 via-slate-800 to-slate-800 rounded-2xl p-4 border border-emerald-500/50 shadow-xl space-y-3.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-white font-bold text-base">
                      <FileSpreadsheet className="w-5 h-5 text-emerald-400" />
                      <span>線上 Google 試算表 (Excel) 網址</span>
                    </div>
                    {isUnlocked ? (
                      <div className="flex items-center gap-2">
                        <span className="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-medium border border-emerald-500/30">
                          已解鎖
                        </span>
                        <button
                          type="button"
                          onClick={handleLockSecret}
                          className="text-xs text-slate-400 hover:text-rose-400 underline cursor-pointer"
                        >
                          重新鎖定
                        </button>
                      </div>
                    ) : (
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-medium border border-amber-500/30 flex items-center gap-1">
                        <Lock className="w-3.5 h-3.5" />
                        <span>受密碼保護</span>
                      </span>
                    )}
                  </div>

                  {!isUnlocked ? (
                    <div className="space-y-3 pt-1">
                      <p className="text-xs text-slate-300 leading-relaxed">
                        此網址已進行<strong>源碼加密保護</strong>（公開於 GitHub 亦無法被直接讀取）。請輸入管理密碼查看與開啟網址：
                      </p>

                      <div className="flex gap-2">
                        <input
                          type="password"
                          placeholder="請輸入密碼 (預設: 0429)"
                          value={inputPassword}
                          onChange={(e) => setInputPassword(e.target.value)}
                          onKeyDown={(e) => { if (e.key === 'Enter') handleUnlockSecret(); }}
                          className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                        />
                        <button
                          type="button"
                          onClick={() => handleUnlockSecret()}
                          className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-sm font-bold flex items-center gap-1.5 shadow-md shadow-emerald-600/30 cursor-pointer whitespace-nowrap"
                        >
                          <Unlock className="w-4 h-4" />
                          <span>解鎖網址</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-3 pt-1">
                      <p className="text-xs text-slate-300 leading-relaxed">
                        點擊下方按鈕可直接開啟或複製您線上實時對帳與寫入的 Google 試算表：
                      </p>

                      <div className="bg-slate-900/90 rounded-xl p-2.5 border border-slate-700/80 flex items-center justify-between gap-2">
                        <span className="text-xs font-mono text-emerald-300 truncate flex-1">
                          {unlockedSheetUrl}
                        </span>
                        <button
                          type="button"
                          onClick={() => {
                            fallbackCopy(unlockedSheetUrl);
                            showToast('📋 已複製 Google 試算表網址');
                          }}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium flex items-center gap-1 active:scale-95 cursor-pointer border border-slate-700 whitespace-nowrap"
                        >
                          <Copy className="w-3.5 h-3.5" />
                          <span>複製</span>
                        </button>
                      </div>

                      <a
                        href={unlockedSheetUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 border border-emerald-400/30 cursor-pointer transition-all"
                      >
                        <ExternalLink className="w-4 h-4" />
                        <span>點此開啟線上 Google 試算表 (Excel)</span>
                      </a>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* 底部導覽列 */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-3 pt-2 pb-5">
            <div className="max-w-md mx-auto grid grid-cols-4 gap-1">
              <button
                type="button"
                onClick={() => setCurrentTab('form')}
                className={`flex flex-col items-center justify-center py-1.5 rounded-xl transition-all cursor-pointer ${
                  currentTab === 'form'
                    ? 'text-rose-400 font-bold bg-rose-500/10'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Plus className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">快速下單</span>
              </button>

              <button
                type="button"
                onClick={() => setCurrentTab('orders')}
                className={`flex flex-col items-center justify-center py-1.5 rounded-xl relative transition-all cursor-pointer ${
                  currentTab === 'orders'
                    ? 'text-indigo-400 font-bold bg-indigo-500/10'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Layers className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">訂單清單</span>
                {orders.length > 0 && (
                  <span className="absolute top-1 right-3 bg-indigo-500 text-white font-mono text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                    {orders.length}
                  </span>
                )}
              </button>

              <button
                type="button"
                onClick={() => setCurrentTab('pricing')}
                className={`flex flex-col items-center justify-center py-1.5 rounded-xl transition-all cursor-pointer ${
                  currentTab === 'pricing'
                    ? 'text-amber-400 font-bold bg-amber-500/10'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Table className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">定價管理</span>
              </button>

              <button
                type="button"
                onClick={() => setCurrentTab('sync')}
                className={`flex flex-col items-center justify-center py-1.5 rounded-xl transition-all cursor-pointer ${
                  currentTab === 'sync'
                    ? 'text-emerald-400 font-bold bg-emerald-500/10'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <FileSpreadsheet className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">匯出同步</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
